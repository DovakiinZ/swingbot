# ==============================================================================
# SWINGBOT CONFIGURATION — Offensive Mode (Live Trading)
# ==============================================================================

# -- Exchange ------------------------------------------------------------------
trading_exchange: mexc
market_data_exchange: bybit
bybit_account_type: spot
trading_mode: live  # OFFENSIVE MODE: Live Trading Enabled

# -- Scan Speed ----------------------------------------------------------------
scan_interval_minutes: 5

# -- Strategy & Scanning -------------------------------------------------------
timeframe: "1h"
lookback: 200
scan_top_n: 50
scanner:
  enabled: true
  breakout_lookback: 20
  btc_correlation_factor: 0.8

# -- Multi-Timeframe Confluence ------------------------------------------------
mtf_filter_enabled: true
htf_timeframe: "4h"
htf_ema_period: 200

# -- Signal Quality Gates ------------------------------------------------------
allow_short: true
min_score: 70  # Offensive Gate
min_rr_ratio: 2.0
volume_multiplier: 1.5
signal_score_threshold: 65

# -- Risk Management -----------------------------------------------------------
risk_per_trade_percent: 1.5  # Managed live risk
max_risk_per_trade_pct: 2.0
max_open_positions: 2        # Controlled offensive start
max_portfolio_risk_percent: 5.0
max_single_position_percent: 30.0
daily_loss_limit_percent: 2.0
max_daily_loss_usd: 100.0
consecutive_loss_limit: 3
api_failure_limit: 5

# -- Compounding ---------------------------------------------------------------
base_balance: 1000.0
peak_balance_tracking: true
drawdown_reset_threshold: 0.20

# -- Market Regime Detection ---------------------------------------------------
regime_adx_threshold: 25  # Higher threshold for trend confirmation

# -- Paper Trading -------------------------------------------------------------
paper_start_balance_usdt: 1000.0

# -- Dynamic Symbol Scanner ----------------------------------------------------
dynamic_symbols: true
max_symbols: 100
min_24h_volume_usdt: 2000000

# -- Sentiment (4-source engine) -----------------------------------------------
sentiment_threshold: 20  # Strict offensive sentiment gate
fear_greed_enabled: true

# -- Account -------------------------------------------------------------------
account_name: "Swingbot Offensive Live"
live: true  # LIVE ON

# -- WebSocket Real-Time Monitor -----------------------------------------------
websocket:
  enabled: true
  symbols:
    - BTC/USDT
    - ETH/USDT
    - SOL/USDT
    - BNB/USDT
    - XRP/USDT
    - DOGE/USDT
    - AVAX/USDT
    - PEPE/USDT
    - WIF/USDT

# -- ATR-Based Stop Loss / Take Profit -----------------------------------------
atr_multiplier_sl: 2.0
atr_multiplier_tp: 5.0

# -- Notifications -------------------------------------------------------------
notifications:
  discord:
    enabled: true
    channels:
      general: "https://discord.com/api/webhooks/1483934741265907772/LCHSthgJHFIpzvL0xlE79dTa2o1WnfU4aXzhDmw27Y4z5ray5FQrxIfHCQhO0TYlLR8s"
      trades: "https://discord.com/api/webhooks/1483934741265907772/LCHSthgJHFIpzvL0xlE79dTa2o1WnfU4aXzhDmw27Y4z5ray5FQrxIfHCQhO0TYlLR8s"
      closed: "https://discord.com/api/webhooks/1483934741265907772/LCHSthgJHFIpzvL0xlE79dTa2o1WnfU4aXzhDmw27Y4z5ray5FQrxIfHCQhO0TYlLR8s"
      warnings: "https://discord.com/api/webhooks/1483934741265907772/LCHSthgJHFIpzvL0xlE79dTa2o1WnfU4aXzhDmw27Y4z5ray5FQrxIfHCQhO0TYlLR8s"
      reports: "https://discord.com/api/webhooks/1483934741265907772/LCHSthgJHFIpzvL0xlE79dTa2o1WnfU4aXzhDmw27Y4z5ray5FQrxIfHCQhO0TYlLR8s"

# -- Beast Mode: Protections ---------------------------------------------------
protections:
  stoploss_guard_enabled: true
  cooldown_enabled: true
  max_dd_enabled: true
  max_dd_pct: 10.0  # Offensive protective stop

# -- Dashboard -----------------------------------------------------------------
dashboard:
  enabled: true
  port: 8080
  host: '0.0.0.0'
